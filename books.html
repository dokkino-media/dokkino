<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dokkino Книги</title>
<style>
  :root {
    --bg-main: #FDFBF7; --card-bg: #F5F0EB; --card-border: #E6DFD5;
    --text-primary: #1A1918; --text-secondary: #5C5852; --gold-accent: #C59B27;
  }
  body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 60px 20px; box-sizing: border-box; }
  .cw-container { max-width: 900px; margin: 0 auto; }
  .cw-back { display: inline-block; font-size: 13px; color: var(--text-secondary); text-decoration: none; margin-bottom: 40px; }
  .cw-back:hover { color: var(--gold-accent); }
  .cw-pen-name { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-accent); font-weight: 600; margin-bottom: 10px; }
  .cw-title { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 16px 0; }
  .cw-intro { font-size: 16px; line-height: 1.7; color: var(--text-secondary); max-width: 640px; margin: 0 0 60px 0; }
  .cw-section-label { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
  .empty-state { background-color: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 16px; padding: 40px; text-align: center; color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>
<div class="cw-container">
  <a href="index.html" class="cw-back">&larr; dokkino</a>
  <div class="cw-pen-name">Крис Вэй</div>
  <h1 class="cw-title">Джордж Флоринг и его необычные приключения</h1>
  <p class="cw-intro">Серия детских фантастических книг. Главы будут появляться здесь по мере публикации.</p>
  <div class="cw-section-label">Главы</div>
  <div class="empty-state">Главы скоро появятся.</div>
</div>
</body>
</html>
