<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dokkino Музыка</title>
<style>
  :root {
    --bg-main: #FDFBF7; --card-bg: #F5F0EB; --card-border: #E6DFD5;
    --text-primary: #1A1918; --text-secondary: #5C5852; --gold-accent: #C59B27;
  }
  body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 60px 20px; box-sizing: border-box; }
  .dm-container { max-width: 1100px; margin: 0 auto; }
  .dm-back { display: inline-block; font-size: 13px; color: var(--text-secondary); text-decoration: none; margin-bottom: 40px; }
  .dm-back:hover { color: var(--gold-accent); }
  .dm-eyebrow { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-accent); font-weight: 600; margin-bottom: 10px; }
  .dm-title { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 16px 0; }
  .dm-intro { font-size: 16px; line-height: 1.7; color: var(--text-secondary); max-width: 640px; margin: 0 0 60px 0; }
  .empty-state { background-color: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 16px; padding: 40px; text-align: center; color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>
<div class="dm-container">
  <a href="index.html" class="dm-back">&larr; dokkino</a>
  <div class="dm-eyebrow">dokkino Музыка</div>
  <h1 class="dm-title">Атмосферная музыка с элементами ИИ</h1>
  <p class="dm-intro">Ambient, cinematic и deep house. Библиотека будет заполняться треками по одному.</p>
  <div class="empty-state">Библиотека скоро появится.</div>
</div>
</body>
</html>
