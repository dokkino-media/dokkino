<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dokkino music</title>
<style>
  :root {
    --bg-main: #FDFBF7; --card-bg: #F5F0EB; --card-border: #E6DFD5;
    --text-primary: #1A1918; --text-secondary: #5C5852; --gold-accent: #C59B27;
  }
  body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 40px 20px 60px; box-sizing: border-box; }
  .lang-switch { text-align: right; max-width: 1100px; margin: 0 auto 20px; font-size: 14px; font-weight: 600; }
  .lang-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; font-size: 14px; font-weight: 600; }
  .lang-btn.active { color: var(--gold-accent); text-decoration: underline; }
  .dm-container { max-width: 1100px; margin: 0 auto; }
  .dm-back { display: inline-block; font-size: 13px; color: var(--text-secondary); text-decoration: none; margin-bottom: 30px; }
  .dm-back:hover { color: var(--gold-accent); }
  .dm-eyebrow { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-accent); font-weight: 600; margin-bottom: 10px; }
  .dm-title { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 16px 0; }
  .dm-intro { font-size: 16px; line-height: 1.7; color: var(--text-secondary); max-width: 640px; margin: 0 0 60px 0; }
  .empty-state { background-color: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 16px; padding: 40px; text-align: center; color: var(--text-secondary); font-size: 14px; }
  footer { border-top: 1px solid var(--card-border); margin-top: 60px; padding-top: 24px; text-align: center; font-size: 12px; color: #9E988F; }
</style>
</head>
<body>

<div class="lang-switch">
  <button class="lang-btn active" onclick="setLanguage('ru')">RU</button> | 
  <button class="lang-btn" onclick="setLanguage('en')">EN</button>
</div>

<div class="dm-container">
  <a href="index.html" class="dm-back">&larr; dokkino</a>
  <div class="dm-eyebrow">dokkino music</div>
  <h1 class="dm-title" data-ru="Атмосферная музыка с элементами ИИ" data-en="Atmospheric music powered by AI">Атмосферная музыка с элементами ИИ</h1>
  <p class="dm-intro" data-ru="Ambient, cinematic и deep house. Библиотека будет заполняться треками по одному." data-en="Ambient, cinematic, and deep house. Tracks will be added one by one.">Ambient, cinematic и deep house. Библиотека будет заполняться треками по одному.</p>
  <div class="empty-state" data-ru="Библиотека скоро появится." data-en="Library coming soon.">Библиотека скоро появится.</div>

  <footer>
    <div data-ru="&copy; 2026 DOKKINO MEDIA LIMITED. Все права защищены." data-en="&copy; 2026 DOKKINO MEDIA LIMITED. All rights reserved.">&copy; 2026 DOKKINO MEDIA LIMITED. Все права защищены.</div>
  </footer>
</div>

<script>
function setLanguage(lang) {
  localStorage.setItem('dokkino_lang', lang);
  document.querySelectorAll('[data-ru]').forEach(el => {
    el.innerHTML = el.getAttribute('data-' + lang);
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('dokkino_lang') || 'ru';
  setLanguage(savedLang);
});
</script>
</body>
</html>
